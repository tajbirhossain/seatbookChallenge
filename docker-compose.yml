# LOCAL DEVELOPMENT ONLY. The credentials below are public and the seeded accounts have a known
# password. The API refuses to start with them when NODE_ENV=production.
# For production use docker-compose.prod.yml, which requires real secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: seatbook
      POSTGRES_DB: seatbook
    ports:
      # Bound to this machine only (IPv4 and IPv6 loopback, since `localhost` can resolve to either),
      # so nobody else on the network can reach the dev database.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://seatbook:seatbook@db:5432/seatbook
      PORT: 4000
      # Public development value, used only if you don't set JWT_SECRET yourself.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  db-data:
